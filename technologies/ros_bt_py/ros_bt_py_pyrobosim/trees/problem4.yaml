# problem4_guarded.yaml
#
# Problem4.RootSequence                 MemorySequence: constants + one-shot preparation run ONCE
# |- <13 constants>
# |- PrepareChargerAccess               check_if_reachable(charger via hall_dining_closet), empty-handed, once
# `- GuardedMission                     Sequence (NO memory): guard is re-ticked every tick = continuous monitoring
#    |- BatteryGuard                    MemoryFallback: once charging starts it is NOT pre-empted at the threshold
#    |  |- CheckBattery                 check_battery.yaml   (SUCCESS if battery >= threshold)
#    |  `- ChargeBattery                charge_battery.yaml  (go to charger, charge to 95, resume last goal)
#    `- MainTask                        MemorySequence: keeps progress while the guard interrupts
#       |- GetWasteTask                 MemorySequence
#       |  |- GetWaste                  get_waste.yaml  desk / waste0 / dumpster
#       |  `- GetWaste1                 get_waste.yaml  bin  / waste1 / dumpster
#       `- GetBreadAndButter            MemorySequence
#          |- GetBread                  get_object.yaml pantry / bread  / table
#          `- GetButter                 get_object.yaml fridge / butter / table
